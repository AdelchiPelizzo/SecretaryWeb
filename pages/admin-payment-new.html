<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Record Payment</title>

<link rel="stylesheet" href="/css/style.css">


</head>

<body>


<div class="payment-card">

    <h1>Record Payment</h1>

    <form
        method="POST"
        action="/admin/payments/new">

        <div class="payment-details">

            <div class="payment-detail">

                <label
                    class="payment-label"
                    for="businessId">
                    Business
                </label>

                <select
                    id="businessId"
                    name="businessId"
                    required>

                    {{BUSINESS_OPTIONS}}

                </select>

            </div>

            <div class="payment-detail">

                <label
                    class="payment-label"
                    for="amount">
                    Amount
                </label>

                <input
                    id="amount"
                    type="number"
                    name="amount"
                    step="0.01"
                    min="0"
                    required>

            </div>

            <div class="payment-detail">

                <label
                    class="payment-label"
                    for="paymentDate">
                    Payment date
                </label>

                <input
                    id="paymentDate"
                    type="date"
                    name="paymentDate"
                    required>

            </div>

            <div class="payment-detail">

                <label
                    class="payment-label"
                    for="periodFrom">
                    Period from
                </label>

                <input
                    id="periodFrom"
                    type="date"
                    name="periodFrom">

            </div>

            <div class="payment-detail">

                <label
                    class="payment-label"
                    for="periodTo">
                    Period to
                </label>

                <input
                    id="periodTo"
                    type="date"
                    name="periodTo">

            </div>

            <div class="payment-detail">

                <label
                    class="payment-label"
                    for="payerName">
                    Payer name
                </label>

                <input
                    id="payerName"
                    type="text"
                    name="payerName">

            </div>

            <div class="payment-detail">

                <label
                    class="payment-label"
                    for="payerIBAN">
                    Payer IBAN
                </label>

                <input
                    id="payerIBAN"
                    type="text"
                    name="payerIBAN">

            </div>

            <div class="payment-detail">

                <label
                    class="payment-label"
                    for="transactionReference">
                    Transaction reference
                </label>

                <input
                    id="transactionReference"
                    type="text"
                    name="transactionReference">

            </div>

            <div class="payment-detail">

                <label
                    class="payment-label"
                    for="status">
                    Status
                </label>

                <select
                    id="status"
                    name="status">

                    <option value="pending">
                        Pending
                    </option>

                    <option
                        value="confirmed"
                        selected>
                        Confirmed
                    </option>

                    <option value="rejected">
                        Rejected
                    </option>

                </select>

            </div>

            <div class="payment-detail">

                <label
                    class="payment-label"
                    for="notes">
                    Notes
                </label>

                <textarea
                    id="notes"
                    name="notes"></textarea>

            </div>

        </div>

        <button type="submit">
            Record payment
        </button>

    </form>

    <p class="payment-note">

        <a href="/admin/payments">
            Back to payments
        </a>

    </p>

</div>


</body>

</html>
