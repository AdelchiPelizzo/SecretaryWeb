<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Admin Payments</title>

<link
    rel="stylesheet"
    href="/css/style.css">


</head>

<body>


<div class="payment-card admin-payment-card">

    <h1>Admin Payments</h1>

    <p>
        <a
            class="admin-payment-action"
            href="/admin/payments/new">
            Record payment
        </a>
    </p>

    <div class="admin-payment-table">

        <table>

            <thead>

                <tr>
                    <th>Business</th>
                    <th>Payment Reference</th>
                    <th>Status</th>
                    <th>Trial Ends</th>
                    <th>Valid Until</th>
                    <th>Payment History</th>
                    <th>Notes</th>
                    <th>Actions</th>
                </tr>

            </thead>

            <tbody>

                {{PAYMENT_ROWS}}

            </tbody>

        </table>

    </div>

</div>


</body>

</html>
