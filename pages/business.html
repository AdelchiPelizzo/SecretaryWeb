<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Business Profile - Secretary AI</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f7f8fc;
        color: #172033;
        line-height: 1.6;
    }

    /* Navigation */

    nav {
        height: 72px;
        background: #ffffff;
        border-bottom: 1px solid #e8eaf0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 7%;
    }

    .logo {
        font-size: 1.35rem;
        font-weight: 700;
        color: #171b2b;
        text-decoration: none;
    }

    .nav-right {
        display: flex;
        align-items: center;
        gap: 20px;
    }

    .back {
        text-decoration: none;
        color: #5b55e8;
        font-weight: 700;
    }

    /* Page */

    .page {
        max-width: 900px;
        margin: 0 auto;
        padding: 55px 25px;
    }

    .page-header {
        margin-bottom: 30px;
    }

    .page-header h1 {
        font-size: 2.3rem;
        color: #171b2b;
        margin-bottom: 8px;
    }

    .page-header p {
        color: #667085;
        font-size: 1.05rem;
    }

    /* Card */

    .card {
        background: #ffffff;
        border: 1px solid #e5e7ee;
        border-radius: 18px;
        padding: 35px;
        box-shadow: 0 8px 25px rgba(23, 27, 43, 0.05);
    }

    .section {
        margin-bottom: 35px;
    }

    .section:last-child {
        margin-bottom: 0;
    }

    .section h2 {
        font-size: 1.25rem;
        margin-bottom: 18px;
        color: #171b2b;
    }

    .section-description {
        color: #667085;
        margin-bottom: 20px;
    }

    /* Form */

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #172033;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #d9dce5;
        border-radius: 9px;
        font-family: inherit;
        font-size: 1rem;
        outline: none;
    }

    .form-group textarea {
        min-height: 120px;
        resize: vertical;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
        border-color: #5b55e8;
        box-shadow: 0 0 0 3px rgba(91, 85, 232, 0.12);
    }

    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .save-button {
        border: none;
        background: #5b55e8;
        color: #ffffff;
        padding: 14px 24px;
        border-radius: 9px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
    }

    .save-button:hover {
        background: #4d47d5;
    }

    /* Mobile */

    @media (max-width: 600px) {
        nav {
            padding: 0 5%;
        }

        .page {
            padding: 40px 18px;
        }

        .page-header h1 {
            font-size: 2rem;
        }

        .card {
            padding: 25px 20px;
        }

        .form-row {
            grid-template-columns: 1fr;
            gap: 0;
        }
    }
</style>


</head>

<body>


<nav>
    <a href="/" class="logo">Secretary AI</a>

    <div class="nav-right">
        <a href="/dashboard" class="back">Dashboard</a>
    </div>
</nav>

<main class="page">

    <div class="page-header">
        <h1>Business Profile</h1>
        <p>Tell your AI Secretary about your business.</p>
    </div>

    <div class="card">

        <form action="#" method="POST">

            <div class="section">

                <h2>Basic information</h2>

                <p class="section-description">
                    This information helps your AI Secretary identify and
                    describe your business to callers.
                </p>

                <div class="form-group">
                    <label for="businessName">Business name</label>
                    <input
                        type="text"
                        id="businessName"
                        name="businessName"
                        placeholder="Your business name"
                        required
                    >
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="phone">Business phone number</label>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="+39 ..."
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">Business email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="info@example.com"
                        >
                    </div>

                </div>

                <div class="form-group">
                    <label for="description">Business description</label>
                    <textarea
                        id="description"
                        name="description"
                        placeholder="Describe your business, what you offer, and anything your AI Secretary should know."
                    ></textarea>
                </div>

            </div>

            <div class="section">

                <h2>Address</h2>

                <div class="form-group">
                    <label for="address">Street address</label>
                    <input
                        type="text"
                        id="address"
                        name="address"
                        placeholder="Street and number"
                    >
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="city">City</label>
                        <input
                            type="text"
                            id="city"
                            name="city"
                            placeholder="City"
                        >
                    </div>

                    <div class="form-group">
                        <label for="postalCode">Postal code</label>
                        <input
                            type="text"
                            id="postalCode"
                            name="postalCode"
                            placeholder="Postal code"
                        >
                    </div>

                </div>

            </div>

            <div class="section">

                <h2>Opening hours</h2>

                <p class="section-description">
                    These hours help your AI Secretary determine when
                    your business is open.
                </p>

                <div class="form-group">
                    <label for="hours">Opening hours</label>
                    <textarea
                        id="hours"
                        name="hours"
                        placeholder="Example: Monday-Friday 09:00-18:00, Saturday 09:00-13:00, Sunday closed"
                    ></textarea>
                </div>

            </div>

            <button type="submit" class="save-button">
                Save business profile
            </button>

        </form>

    </div>

</main>


</body>
</html>
