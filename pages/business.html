<script>
    document.addEventListener("DOMContentLoaded", () => {

        const timeOptions = [];

        for (let hour = 0; hour < 24; hour++) {
            for (let minute = 0; minute < 60; minute += 30) {
                const hh = String(hour).padStart(2, "0");
                const mm = String(minute).padStart(2, "0");

                timeOptions.push(`${hh}:${mm}`);
            }
        }

        const days = [
            "monday",
            "tuesday",
            "wednesday",
            "thursday",
            "friday",
            "saturday",
            "sunday"
        ];

        days.forEach(day => {
            const openSelect = document.getElementById(`${day}Open`);
            const closeSelect = document.getElementById(`${day}Close`);

            if (!openSelect || !closeSelect) {
                console.error(`Missing select for ${day}`);
                return;
            }

            timeOptions.forEach(time => {
                const openOption = document.createElement("option");
                openOption.value = time;
                openOption.textContent = time;
                openSelect.appendChild(openOption);

                const closeOption = document.createElement("option");
                closeOption.value = time;
                closeOption.textContent = time;
                closeSelect.appendChild(closeOption);
            });
        });

    });
</script>

<body>

<nav>
    <a href="/" class="logo">Secretary AI</a>


<div class="nav-right">
    <a href="/dashboard" class="nav-action-button">Dashboard</a>
</div>


</nav>

<main class="business-page">


<div class="page-header">
    <h1>Business Profile</h1>
    <p>Tell your AI Secretary about your business.</p>
</div>

<div class="card">

    <form action="/business" method="POST">

        <div class="section">

            <h2>Basic information</h2>

            <p class="section-description">
                This information helps your AI Secretary identify and
                describe your business to callers.
            </p>

            <div class="form-group">
                <label for="businessName">Business name</label>
                <input
                    type="text"
                    id="businessName"
                    name="businessName"
                    placeholder="Your business name"
                    value="{{BUSINESS_NAME}}"
                    required
                >
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="phone">Business phone number</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="+39 ..."
                        value="{{PHONE}}"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Business email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="info@example.com"
                        value="{{EMAIL}}"
                    >
                </div>

            </div>

            <div class="form-group">
                <label for="description">Business description</label>
                <textarea
                    id="description"
                    name="description"
                    placeholder="Describe your business, what you offer, and anything your AI Secretary should know."
                >{{DESCRIPTION}}</textarea>
            </div>

        </div>

        <div class="section">

            <h2>Address</h2>

            <div class="form-group">
                <label for="address">Street address</label>
                <input
                    type="text"
                    id="address"
                    name="address"
                    placeholder="Street and number"
                    value="{{ADDRESS}}"
                >
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="city">City</label>
                    <input
                        type="text"
                        id="city"
                        name="city"
                        placeholder="City"
                        value="{{CITY}}"
                    >
                </div>

                <div class="form-group">
                    <label for="postalCode">Postal code</label>
                    <input
                        type="text"
                        id="postalCode"
                        name="postalCode"
                        placeholder="Postal code"
                        value="{{POSTAL_CODE}}"
                    >
                </div>

            </div>

        </div>

        <div class="section">

            <h2>Opening hours</h2>

            <p class="section-description">
                Set the opening and closing time for each day.
            </p>

            <div class="opening-hours">

                <!-- Monday / Tuesday -->
                <div class="opening-hours-row">

                    <div class="opening-hours-day">
                        <label for="mondayOpen">Monday</label>

                        <select id="mondayOpen" name="mondayOpen">
                            <option value="">Open</option>
                        </select>

                        <span>to</span>

                        <select id="mondayClose" name="mondayClose">
                            <option value="">Close</option>
                        </select>

                        <label class="closed-option">
                            <input type="checkbox" name="mondayClosed">
                            Closed
                        </label>
                    </div>

                    <div class="opening-hours-day">
                        <label for="tuesdayOpen">Tuesday</label>

                        <select id="tuesdayOpen" name="tuesdayOpen">
                            <option value="">Open</option>
                        </select>

                        <span>to</span>

                        <select id="tuesdayClose" name="tuesdayClose">
                            <option value="">Close</option>
                        </select>

                        <label class="closed-option">
                            <input type="checkbox" name="tuesdayClosed">
                            Closed
                        </label>
                    </div>

                </div>

                <!-- Wednesday / Thursday -->
                <div class="opening-hours-row">

                    <div class="opening-hours-day">
                        <label for="wednesdayOpen">Wednesday</label>

                        <select id="wednesdayOpen" name="wednesdayOpen">
                            <option value="">Open</option>
                        </select>

                        <span>to</span>

                        <select id="wednesdayClose" name="wednesdayClose">
                            <option value="">Close</option>
                        </select>

                        <label class="closed-option">
                            <input type="checkbox" name="wednesdayClosed">
                            Closed
                        </label>
                    </div>

                    <div class="opening-hours-day">
                        <label for="thursdayOpen">Thursday</label>

                        <select id="thursdayOpen" name="thursdayOpen">
                            <option value="">Open</option>
                        </select>

                        <span>to</span>

                        <select id="thursdayClose" name="thursdayClose">
                            <option value="">Close</option>
                        </select>

                        <label class="closed-option">
                            <input type="checkbox" name="thursdayClosed">
                            Closed
                        </label>
                    </div>

                </div>

                <!-- Friday / Saturday -->
                <div class="opening-hours-row">

                    <div class="opening-hours-day">
                        <label for="fridayOpen">Friday</label>

                        <select id="fridayOpen" name="fridayOpen">
                            <option value="">Open</option>
                        </select>

                        <span>to</span>

                        <select id="fridayClose" name="fridayClose">
                            <option value="">Close</option>
                        </select>

                        <label class="closed-option">
                            <input type="checkbox" name="fridayClosed">
                            Closed
                        </label>
                    </div>

                    <div class="opening-hours-day">
                        <label for="saturdayOpen">Saturday</label>

                        <select id="saturdayOpen" name="saturdayOpen">
                            <option value="">Open</option>
                        </select>

                        <span>to</span>

                        <select id="saturdayClose" name="saturdayClose">
                            <option value="">Close</option>
                        </select>

                        <label class="closed-option">
                            <input type="checkbox" name="saturdayClosed">
                            Closed
                        </label>
                    </div>

                </div>

                <!-- Sunday -->
                <div class="opening-hours-row">

                    <div class="opening-hours-day">
                        <label for="sundayOpen">Sunday</label>

                        <select id="sundayOpen" name="sundayOpen">
                            <option value="">Open</option>
                        </select>

                        <span>to</span>

                        <select id="sundayClose" name="sundayClose">
                            <option value="">Close</option>
                        </select>

                        <label class="closed-option">
                            <input type="checkbox" name="sundayClosed" checked>
                            Closed
                        </label>
                    </div>

                </div>

            </div>

        </div>

        <button type="submit" class="save-button">
            Save business profile
        </button>

    </form>

</div>


</main>

<script>
    document.addEventListener("DOMContentLoaded", () => {

        const timeOptions = [];

        for (let hour = 0; hour < 24; hour++) {
            for (let minute = 0; minute < 60; minute += 30) {
                const hh = String(hour).padStart(2, "0");
                const mm = String(minute).padStart(2, "0");

                timeOptions.push(`${hh}:${mm}`);
            }
        }

        const days = [
            "monday",
            "tuesday",
            "wednesday",
            "thursday",
            "friday",
            "saturday",
            "sunday"
        ];

        days.forEach(day => {
            const openSelect = document.getElementById(`${day}Open`);
            const closeSelect = document.getElementById(`${day}Close`);
            const closedCheckbox = document.querySelector(
                `input[name="${day}Closed"]`
            );

            if (!openSelect || !closeSelect || !closedCheckbox) {
                console.error(`Missing opening-hours element for ${day}`);
                return;
            }

            timeOptions.forEach(time => {
                const openOption = document.createElement("option");
                openOption.value = time;
                openOption.textContent = time;
                openSelect.appendChild(openOption);

                const closeOption = document.createElement("option");
                closeOption.value = time;
                closeOption.textContent = time;
                closeSelect.appendChild(closeOption);
            });

            function updateClosedState() {
                openSelect.disabled = closedCheckbox.checked;
                closeSelect.disabled = closedCheckbox.checked;
            }

            closedCheckbox.addEventListener("change", updateClosedState);

            updateClosedState();
        });

    });
</script>

</body>
