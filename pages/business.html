<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>Business Profile - Secretary AI</title>
</head>

<script>
    document.addEventListener("DOMContentLoaded", () => {

        const timeOptions = [];

        for (let hour = 0; hour < 24; hour++) {
            for (let minute = 0; minute < 60; minute += 30) {
                const hh = String(hour).padStart(2, "0");
                const mm = String(minute).padStart(2, "0");

                timeOptions.push(`${hh}:${mm}`);
            }
        }

        const days = [
            "monday",
            "tuesday",
            "wednesday",
            "thursday",
            "friday",
            "saturday",
            "sunday"
        ];

        days.forEach(day => {
            const openSelect = document.getElementById(`${day}Open`);
            const closeSelect = document.getElementById(`${day}Close`);

            if (!openSelect || !closeSelect) {
                console.error(`Missing select for ${day}`);
                return;
            }

            timeOptions.forEach(time => {
                const openOption = document.createElement("option");
                openOption.value = time;
                openOption.textContent = time;
                openSelect.appendChild(openOption);

                const closeOption = document.createElement("option");
                closeOption.value = time;
                closeOption.textContent = time;
                closeSelect.appendChild(closeOption);
            });
        });

    });
</script>

<body>

    <script>
        const language = "{{LANGUAGE}}";

        document.documentElement.lang = language;

        if (language === "ar") {
            document.documentElement.dir = "rtl";
        }
    </script>

<nav>
    <a href="/" class="logo">Secretary AI</a>
    <div class="nav-right">
        <a href="/dashboard" class="nav-action-button" data-i18n="nav.dashboard">Dashboard</a>
    </div>
</nav>

<main class="business-page">


<div class="page-header">
    <h1 data-i18n="business.title">Business Profile</h1>
    <p data-i18n="business.intro">Tell your AI Secretary about your business.</p>
</div>

<div class="card">

    <form action="/business" method="POST">

        <div class="section">

            <h2 data-i18n="business.basic_information">Basic information</h2>
            <p class="section-description" data-i18n="business.basic_information_description">
                This information helps your AI Secretary identify and
                describe your business to callers.
            </p>

            <div class="form-group">
                <label for="businessName" data-i18n="business.name">Business name</label>
                <input
                    type="text"
                    id="businessName"
                    name="businessName"
                    data-i18n-placeholder="business.name_placeholder"
                    placeholder="Your business name"
                    value="{{BUSINESS_NAME}}"
                    required
                >
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="phone" data-i18n="business.phone">Business phone number</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="+39 ..."
                        value="{{PHONE}}"
                    >
                </div>

                <div class="form-group">
                    <label for="email" data-i18n="business.email">Business email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="info@example.com"
                        value="{{EMAIL}}"
                    >
                </div>

            </div>

            <div class="form-group">
                <label for="description" data-i18n="business.description">Business description</label>
                <textarea
                    id="description"
                    name="description"
                    placeholder="Describe your business, what you offer, and anything your AI Secretary should know."
                >{{DESCRIPTION}}</textarea>
            </div>

            <div class="form-group">
                <label for="language" data-i18n="business.language">Language</label>
                <select id="language" name="language">
                    <option value="en">English</option>
                    <option value="it">Italiano</option>
                </select>
            </div>

        </div>

        <div class="section">

            <h2 data-i18n="business.address">Address</h2>

            <div class="form-group">
                <label for="address" data-i18n="business.street_address">Street address</label>
                <input
                    type="text"
                    id="address"
                    name="address"
                    placeholder="Street and number"
                    value="{{ADDRESS}}"
                >
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="city" data-i18n="business.city">City</label>
                    <input
                        type="text"
                        id="city"
                        name="city"
                        placeholder="City"
                        value="{{CITY}}"
                    >
                </div>

                <div class="form-group">
                    <label for="postalCode" data-i18n="business.postal_code">Postal code</label>
                    <input
                        type="text"
                        id="postalCode"
                        name="postalCode"
                        placeholder="Postal code"
                        value="{{POSTAL_CODE}}"
                    >
                </div>

            </div>

        </div>

        <div class="section">

            <h2 data-i18n="business.opening_hours">Opening hours</h2>
            <p class="section-description" data-i18n="business.opening_hours_description">
                Set the opening and closing time for each day.
            </p>

            <div class="opening-hours">

                <!-- Monday / Tuesday -->
                <div class="opening-hours-row">

                    <div class="opening-hours-day">
                        <label for="mondayOpen" data-i18n="days.monday">Monday</label>

                        <select id="mondayOpen" name="mondayOpen">
                            <option value="" data-i18n="business.open">Open</option>
                        </select>

                        <span data-i18n="business.to">to</span>

                        <select id="mondayClose" name="mondayClose">
                            <option value="" data-i18n="business.close">Close</option>
                        </select>

                        <label class="closed-option">
                            <input type="checkbox" name="mondayClosed">
                            <span data-i18n="business.closed">Closed</span>
                        </label>
                    </div>

                    <div class="opening-hours-day">
                        <label for="tuesdayOpen" data-i18n="days.tuesday">Tuesday</label>

                        <select id="tuesdayOpen" name="tuesdayOpen">
                            <option value="" data-i18n="business.open">Open</option>
                        </select>

                        <span data-i18n="business.to">to</span>

                        <select id="tuesdayClose" name="tuesdayClose">
                            <option value="" data-i18n="business.close">Close</option>
                        </select>

                        <label class="closed-option">
                            <input type="checkbox" name="tuesdayClosed">
                            <span data-i18n="business.closed">Closed</span>
                        </label>
                    </div>

                </div>

                <!-- Wednesday / Thursday -->
                <div class="opening-hours-row">

                    <div class="opening-hours-day">
                        <label for="wednesdayOpen" data-i18n="days.wednesday">Wednesday</label>

                        <select id="wednesdayOpen" name="wednesdayOpen">
                            <option value="" data-i18n="business.open">Open</option>
                        </select>

                        <span data-i18n="business.to">to</span>

                        <select id="wednesdayClose" name="wednesdayClose">
                            <option value="" data-i18n="business.close">Close</option>
                        </select>

                        <label class="closed-option">
                            <input type="checkbox" name="wednesdayClosed">
                            <span data-i18n="business.closed">Closed</span>
                        </label>

                    </div>

                    <div class="opening-hours-day">
                        <label for="thursdayOpen" data-i18n="days.thursday">Thursday</label>

                        <select id="thursdayOpen" name="thursdayOpen">
                            <option value="" data-i18n="business.open">Open</option>
                        </select>

                        <span data-i18n="business.to">to</span>

                        <select id="thursdayClose" name="thursdayClose">
                            <option value="" data-i18n="business.close">Close</option>
                        </select>

                        <label class="closed-option">
                            <input type="checkbox" name="thursdayClosed">
                            <span data-i18n="business.closed">Closed</span>
                        </label>
                    </div>

                </div>

                <!-- Friday / Saturday -->
                <div class="opening-hours-row">

                    <div class="opening-hours-day">
                        <label for="fridayOpen" data-i18n="days.friday">Friday</label>

                        <select id="fridayOpen" name="fridayOpen">
                            <option value="" data-i18n="business.open">Open</option>
                        </select>

                        <span data-i18n="business.to">to</span>

                        <select id="fridayClose" name="fridayClose">
                            <option value="" data-i18n="business.close">Close</option>
                        </select>

                        <label class="closed-option">
                            <input type="checkbox" name="fridayClosed">
                            <span data-i18n="business.closed">Closed</span>
                        </label>
                    </div>

                    <div class="opening-hours-day">
                        <label for="saturdayOpen" data-i18n="days.saturday">Saturday</label>

                        <select id="saturdayOpen" name="saturdayOpen">
                            <option value="" data-i18n="business.open">Open</option>
                        </select>

                        <span data-i18n="business.to">to</span>

                        <select id="saturdayClose" name="saturdayClose">
                            <option value="" data-i18n="business.close">Close</option>
                        </select>

                        <label class="closed-option">
                            <input type="checkbox" name="saturdayClosed">
                            <span data-i18n="business.closed">Closed</span>
                        </label>
                    </div>

                </div>

                <!-- Sunday -->
                <div class="opening-hours-row">

                    <div class="opening-hours-day">
                        <label for="sundayOpen" data-i18n="days.sunday">Sunday</label>

                        <select id="sundayOpen" name="sundayOpen">
                            <option value="" data-i18n="business.open">Open</option>
                        </select>

                        <span data-i18n="business.to">to</span>

                        <select id="sundayClose" name="sundayClose">
                            <option value="" data-i18n="business.close">Close</option>
                        </select>

                        <label class="closed-option">
                            <input type="checkbox" name="sundayClosed" checked>
                            <span data-i18n="business.closed">Closed</span>
                        </label>
                    </div>

                </div>

            </div>

        </div>

        <button type="submit" class="save-button" data-i18n="business.save">
            Save business profile
        </button>

    </form>

</div>


</main>

<script>
    document.addEventListener("DOMContentLoaded", () => {

        const timeOptions = [];

        for (let hour = 0; hour < 24; hour++) {
            for (let minute = 0; minute < 60; minute += 30) {
                const hh = String(hour).padStart(2, "0");
                const mm = String(minute).padStart(2, "0");

                timeOptions.push(`${hh}:${mm}`);
            }
        }

        const days = [
            "monday",
            "tuesday",
            "wednesday",
            "thursday",
            "friday",
            "saturday",
            "sunday"
        ];

        const savedHours = {
            monday: {
                open: "{{MONDAY_OPEN}}",
                close: "{{MONDAY_CLOSE}}",
                closed: "{{MONDAY_CLOSED}}" === "checked"
            },
            tuesday: {
                open: "{{TUESDAY_OPEN}}",
                close: "{{TUESDAY_CLOSE}}",
                closed: "{{TUESDAY_CLOSED}}" === "checked"
            },
            wednesday: {
                open: "{{WEDNESDAY_OPEN}}",
                close: "{{WEDNESDAY_CLOSE}}",
                closed: "{{WEDNESDAY_CLOSED}}" === "checked"
            },
            thursday: {
                open: "{{THURSDAY_OPEN}}",
                close: "{{THURSDAY_CLOSE}}",
                closed: "{{THURSDAY_CLOSED}}" === "checked"
            },
            friday: {
                open: "{{FRIDAY_OPEN}}",
                close: "{{FRIDAY_CLOSE}}",
                closed: "{{FRIDAY_CLOSED}}" === "checked"
            },
            saturday: {
                open: "{{SATURDAY_OPEN}}",
                close: "{{SATURDAY_CLOSE}}",
                closed: "{{SATURDAY_CLOSED}}" === "checked"
            },
            sunday: {
                open: "{{SUNDAY_OPEN}}",
                close: "{{SUNDAY_CLOSE}}",
                closed: "{{SUNDAY_CLOSED}}" === "checked"
            }
        };

        days.forEach(day => {

            const openSelect = document.getElementById(`${day}Open`);
            const closeSelect = document.getElementById(`${day}Close`);
            const closedCheckbox = document.querySelector(
                `input[name="${day}Closed"]`
            );

            if (!openSelect || !closeSelect || !closedCheckbox) {
                console.error(`Missing opening-hours element for ${day}`);
                return;
            }

            timeOptions.forEach(time => {
                const openOption = document.createElement("option");
                openOption.value = time;
                openOption.textContent = time;
                openSelect.appendChild(openOption);

                const closeOption = document.createElement("option");
                closeOption.value = time;
                closeOption.textContent = time;
                closeSelect.appendChild(closeOption);
            });

            const saved = savedHours[day];

            if (saved.open) {
                openSelect.value = saved.open;
            }

            if (saved.close) {
                closeSelect.value = saved.close;
            }

            closedCheckbox.checked = saved.closed;

            function updateClosedState() {
                openSelect.disabled = closedCheckbox.checked;
                closeSelect.disabled = closedCheckbox.checked;
            }

            closedCheckbox.addEventListener("change", updateClosedState);

            updateClosedState();
        });

    });
</script>
<script>
    fetch("/locales/" + language + ".json", { cache: "no-store" })
        .then(response => {
            if (!response.ok) throw new Error("Locale not found");
            return response.json();
        })
        .then(translations => {
            document.querySelectorAll("[data-i18n]").forEach(element => {
                const key = element.getAttribute("data-i18n");

                if (Object.prototype.hasOwnProperty.call(translations, key)) {
                    element.textContent = translations[key];
                }
            });

            document.querySelectorAll("[data-i18n-placeholder]").forEach(element => {
                const key = element.getAttribute("data-i18n-placeholder");

                if (Object.prototype.hasOwnProperty.call(translations, key)) {
                    element.placeholder = translations[key];
                }
            });
        })
        .catch(error => {
            console.error("Could not load business language:", error);
        });
</script>

</body>
</html>
