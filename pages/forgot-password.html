<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Secretary AI</title>

    <link
        rel="stylesheet"
        href="/css/style.css">

</head>

<body>

    <nav>

        <a
            href="/"
            class="logo">
            Secretary AI
        </a>

        <div class="nav-links">

            <a
                href="/"
                class="home-button"
                data-i18n="nav.home">
                Home
            </a>

            <a
                href="/register"
                class="register-button"
                data-i18n="nav.register">
                Register
            </a>

        </div>

    </nav>


    <section class="forgot-section">

        <div class="forgot-container">

            <div class="forgot-header">

                <h1 data-i18n="forgot.title">
                    Forgot your password?
                </h1>

                <p data-i18n="forgot.intro">
                    Enter your email address and we will send you
                    instructions to reset your password.
                </p>

            </div>


            <div class="forgot-card">

                <form
                    action="/forgot-password"
                    method="POST">

                    <div class="form-group">

                        <label
                            for="email"
                            data-i18n="login.email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            data-i18n-placeholder="login.email_placeholder"
                            placeholder="you@example.com"
                            required>

                    </div>


                    <button
                        type="submit"
                        class="forgot-button"
                        data-i18n="forgot.submit">
                        Send reset instructions
                    </button>

                </form>


                <div class="forgot-footer">

                    <a
                        href="/login"
                        data-i18n="forgot.back_to_login">
                        Back to login
                    </a>

                </div>

            </div>

        </div>

    </section>


    <script>

        const language =
            localStorage.getItem("secretaryLanguage") || "en";

        document.documentElement.lang = language;

        if (language === "ar") {
            document.documentElement.dir = "rtl";
        }

        fetch(
            "/locales/" + language + ".json",
            { cache: "no-store" }
        )
            .then(response => {

                if (!response.ok) {
                    throw new Error("Locale not found");
                }

                return response.json();

            })
            .then(translations => {

                document
                    .querySelectorAll("[data-i18n]")
                    .forEach(element => {

                        const key =
                            element.getAttribute("data-i18n");

                        if (
                            Object.prototype.hasOwnProperty.call(
                                translations,
                                key
                            )
                        ) {
                            element.innerHTML =
                                translations[key];
                        }

                    });


                document
                    .querySelectorAll("[data-i18n-placeholder]")
                    .forEach(element => {

                        const key =
                            element.getAttribute(
                                "data-i18n-placeholder"
                            );

                        if (
                            Object.prototype.hasOwnProperty.call(
                                translations,
                                key
                            )
                        ) {
                            element.placeholder =
                                translations[key];
                        }

                    });

            })
            .catch(error => {

                console.error(
                    "Could not load forgot-password language:",
                    error
                );

            });

    </script>

</body>

</html>
