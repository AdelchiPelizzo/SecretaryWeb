<html lang="en">
<head>
    <meta charset="UTF-8">

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f7f8fc;
        color: #172033;
        line-height: 1.6;
        min-height: 100vh;
    }

    /* Navigation */

        height: 72px;

    /* Login */

    .login-section {
        min-height: calc(100vh - 72px);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 60px 20px;
        background:
            radial-gradient(circle at top left, #eeedff 0%, transparent 35%),
            linear-gradient(135deg, #f7f8fc 0%, #ffffff 100%);
    }

    .login-container {
        width: 100%;
        max-width: 440px;
    }

    .login-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .login-header h1 {
        font-size: 2.4rem;
        margin-bottom: 10px;
        color: #171b2b;
    }

    .login-header p {
        color: #667085;
        font-size: 1rem;
    }

    .login-card {
        background: #ffffff;
        border: 1px solid #e5e7ee;
        border-radius: 18px;
        padding: 38px;
        box-shadow: 0 12px 35px rgba(23, 27, 43, 0.08);
    }

    .form-group {
        margin-bottom: 22px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #172033;
    }

    .form-group input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #d9dce5;
        border-radius: 9px;
        font-size: 1rem;
        outline: none;
    }

    .form-group input:focus {
        border-color: #5b55e8;
        box-shadow: 0 0 0 3px rgba(91, 85, 232, 0.12);
    }

    .login-button {
        width: 100%;
        border: none;
        background: #5b55e8;
        color: #ffffff;
        padding: 14px;
        border-radius: 9px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
    }

    .login-button:hover {
        background: #4d47d5;
    }

    .forgot-password {
        display: block;
        text-align: right;
        margin-top: -10px;
        margin-bottom: 22px;
        color: #5b55e8;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 600;
    }

    .login-footer {
        text-align: center;
        margin-top: 24px;
        color: #667085;
    }

    .login-footer a {
        color: #5b55e8;
        text-decoration: none;
        font-weight: 700;
    }

    /* Mobile */

    @media (max-width: 600px) {
        nav {
            padding: 0 5%;
        }

        .login-section {
            padding: 40px 18px;
        }

        .login-header h1 {
            font-size: 2rem;
        }

        .login-card {
            padding: 28px 22px;
        }
    }
</style>
</head>

<body>
<nav>
    <a href="/" class="logo">Secretary AI</a>

    <div class="nav-links">
        <a href="/" class="home-button">Home</a>
        <a href="/register" class="register-button">Register</a>
    </div>
</nav>

<section class="login-section">

    <div class="login-container">

        <div class="login-header">
            <h1>Welcome back</h1>
            <p>Log in to manage your AI Secretary.</p>
        </div>

        <div class="login-card">
           <!--  <form action="/login" method="POST"> -->
            <form action="/login" method="POST">

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <a href="#" class="forgot-password">Forgot password?</a>

                <!--<button type="submit" class="login-button">
                    Log in
                </button>-->
                <button type="submit" class="login-button">
                    Log in
                </button>

            </form>

            <div class="login-footer">
                Don't have an account?
                <a href="/register">Create one</a>
            </div>

        </div>

    </div>

</section>

</body>
</html>
