    }

    /* Login */

    .login-section {
        min-height: calc(100vh - 72px);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 60px 20px;
        background:
            radial-gradient(circle at top left, #eeedff 0%, transparent 35%),
            linear-gradient(135deg, #f7f8fc 0%, #ffffff 100%);
    }

    .login-container {
        width: 100%;
        max-width: 440px;
    }

    .login-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .login-header h1 {
        font-size: 2.4rem;
        margin-bottom: 10px;
        color: #171b2b;
    }

    .login-header p {
        color: #667085;
        font-size: 1rem;
    }

    .login-card {
        background: #ffffff;
        border: 1px solid #e5e7ee;
        border-radius: 18px;
        padding: 38px;
        box-shadow: 0 12px 35px rgba(23, 27, 43, 0.08);
    }

    .form-group {
        margin-bottom: 22px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #172033;
    }

    .form-group input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #d9dce5;
        border-radius: 9px;
        font-size: 1rem;
        outline: none;
    }

    .form-group input:focus {
        border-color: #5b55e8;
        box-shadow: 0 0 0 3px rgba(91, 85, 232, 0.12);
    }

    .login-button {
        width: 100%;
        border: none;
        background: #5b55e8;
        color: #ffffff;
        padding: 14px;
        border-radius: 9px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
    }

    .login-button:hover {
        background: #4d47d5;
    }

    .forgot-password {
        display: block;
        text-align: right;
        margin-top: -10px;
        margin-bottom: 22px;
        color: #5b55e8;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 600;
    }

    .login-footer {
        text-align: center;
        margin-top: 24px;
        color: #667085;
    }

    .login-footer a {
        color: #5b55e8;
        text-decoration: none;
        font-weight: 700;
    }

    /* Mobile */

    @media (max-width: 600px) {
        nav {
            padding: 0 5%;
        }

        .login-section {
            padding: 40px 18px;
        }

        .login-header h1 {
            font-size: 2rem;
        }

        .login-card {
            padding: 28px 22px;
        }
    }
</style>
</head>

<body>
    <script>
        (function () {
            const savedLanguage = localStorage.getItem("secretaryLanguage") || "en";
            document.documentElement.lang = savedLanguage;

            if (savedLanguage === "ar") {
                document.documentElement.dir = "rtl";
            }
        })();
    </script>
<nav>
    <a href="/" class="logo">Secretary AI</a>

    <div class="nav-links">
        <a href="/" class="home-button" data-i18n="nav.home">Home</a>
        <a href="/register" class="register-button" data-i18n="nav.register">Register</a>
    </div>
</nav>

<section class="login-section">

    <div class="login-container">

        <div class="login-header">
            <h1 data-i18n="login.title">Welcome back</h1>
            <p data-i18n="login.intro">Log in to manage your AI Secretary.</p>
        </div>

        <div class="login-card">
           <!--  <form action="/login" method="POST"> -->
            <form action="/login" method="POST">

                <div class="form-group">
                    <label for="email" data-i18n="login.email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        data-i18n-placeholder="login.email_placeholder"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password" data-i18n="login.password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        data-i18n-placeholder="login.password_placeholder"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <a href="#" class="forgot-password" data-i18n="login.forgot">Forgot password?</a>

                <button type="submit" class="login-button" data-i18n="login.submit">
                    Log in
                </button>

            </form>

            <div class="login-footer">
                <span data-i18n="login.already_have_account">
                    Don't have an account?
                </span>
                <a href="/register" data-i18n="login.create">Create one</a>
            </div>

        </div>

    </div>

</section>

    <script>
        (function () {
            const language = localStorage.getItem("secretaryLanguage") || "en";

            fetch("/locales/" + language + ".json", { cache: "no-store" })
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Locale not found");
                    }
                    return response.json();
                })
                .then(translations => {
                    document.querySelectorAll("[data-i18n]").forEach(element => {
                        const key = element.getAttribute("data-i18n");

                        if (Object.prototype.hasOwnProperty.call(translations, key)) {
                            element.textContent = translations[key];
                        }
                    });

                    document.querySelectorAll("[data-i18n-placeholder]").forEach(element => {
                        const key = element.getAttribute("data-i18n-placeholder");

                        if (Object.prototype.hasOwnProperty.call(translations, key)) {
                            element.placeholder = translations[key];
                        }
                    });
                })
                .catch(error => {
                    console.error("Could not load login language:", error);
                });
        })();
    </script>

</body>

</html>
