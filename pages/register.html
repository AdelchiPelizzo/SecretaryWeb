<body>

<!-- =========================
     NAVIGATION
========================= -->

<nav>
<div class="logo">
    SECRETARY AI
</div>

<div class="nav-links">

    <a href="/" class="home-button">
        Home
    </a>

    <a class="register-login-button" href="/login">
        Login
    </a>

</div>

</nav>

<!-- =========================
     REGISTER
========================= -->

<section class="register-section">

<div class="register-container">

    <div class="register-heading">

        <div class="register-label">
            GET STARTED
        </div>

        <h1>
            Create your account
        </h1>

        <p>
            Set up your Secretary AI account and start building
            your business assistant.
        </p>

    </div>


    <div class="register-card">

        <form action="/register" method="POST">

            <div class="form-group">

                <label for="businessName">
                    Business name
                </label>

                <input
                    type="text"
                    id="businessName"
                    name="businessName"
                    placeholder="Your business name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <button
                type="submit"
                class="register-submit">
                Create account
            </button>

        </form>


        <div class="login-text">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </div>

    </div>

</div>

</section>

</body>
