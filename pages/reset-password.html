<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Reset Password - Secretary AI</title>

    <link
        rel="stylesheet"
        href="/css/style.css">

</head>

<body>

    <nav>

        <a
            href="/"
            class="logo">
            Secretary AI
        </a>

        <div class="nav-links">

            <a
                href="/"
                class="home-button"
                data-i18n="nav.home">
                Home
            </a>

            <a
                href="/register"
                class="register-button"
                data-i18n="nav.register">
                Register
            </a>

        </div>

    </nav>


    <section class="reset-section">

        <div class="reset-container">

            <div class="reset-header">

                <h1 data-i18n="reset.title">
                    Reset your password
                </h1>

                <p data-i18n="reset.intro">
                    Enter your new password below.
                </p>

            </div>


            <div class="reset-card">

                <form
                    action="/reset-password"
                    method="POST">

                    <input
                        type="hidden"
                        id="token"
                        name="token">


                    <div class="form-group">

                        <label
                            for="password"
                            data-i18n="reset.new_password">
                            New password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            required>

                    </div>


                    <div class="form-group">

                        <label
                            for="confirmPassword"
                            data-i18n="reset.confirm_password">
                            Confirm password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            required>

                    </div>


                    <button
                        type="submit"
                        class="reset-button"
                        data-i18n="reset.submit">
                        Reset password
                    </button>

                </form>


                <div class="reset-footer">

                    <a
                        href="/login"
                        data-i18n="reset.back_to_login">
                        Back to login
                    </a>

                </div>

            </div>

        </div>

    </section>


    <script>

        const params =
            new URLSearchParams(window.location.search);

        const token =
            params.get("token");

        document.getElementById("token").value =
            token || "";


        const language =
            localStorage.getItem("secretaryLanguage") || "en";

        document.documentElement.lang =
            language;

        if (language === "ar") {
            document.documentElement.dir =
                "rtl";
        }


        fetch(
            "/locales/" + language + ".json",
            { cache: "no-store" }
        )
            .then(response => {

                if (!response.ok) {
                    throw new Error("Locale not found");
                }

                return response.json();

            })
            .then(translations => {

                document
                    .querySelectorAll("[data-i18n]")
                    .forEach(element => {

                        const key =
                            element.getAttribute(
                                "data-i18n"
                            );

                        if (
                            Object.prototype.hasOwnProperty.call(
                                translations,
                                key
                            )
                        ) {
                            element.innerHTML =
                                translations[key];
                        }

                    });

            })
            .catch(error => {

                console.error(
                    "Could not load reset-password language:",
                    error
                );

            });

    </script>

</body>

</html>
